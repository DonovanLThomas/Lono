[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-python"
version = "0.1.0"
description = "A CLI chatbot using Llama LLM"
authors = [{name = "Donovan Thomas", email = "dlthomas2005@gmail.com"}]
license = {text = "MIT"}
dependencies = [
    "ollama==0.4.4",
    "python-dotenv==1.0.0",
    "google-api-python-client>=2.0,<3",
    "google-auth-httplib2>=0.2,<1",
    "google-auth-oauthlib>=1.2,<2",
]

[project.scripts]
wake-lono = "src.main:main"
run-tests = "src.main:run_tests"

[tool.setuptools]
packages = ["src"]
